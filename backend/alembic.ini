[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
# Tên file migration: 0001_create_feedback.py
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url lấy từ app.core.config (DATABASE_URL trong .env), không ghi ở đây.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

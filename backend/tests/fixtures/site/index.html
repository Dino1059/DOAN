<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo App — Login</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 60px auto; color: #222; }
  .screen { display: none; }
  .screen.active { display: block; }
  input { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin: 6px 0 14px; }
  button { padding: 8px 16px; cursor: pointer; }
  .toast-success { background: #e6ffed; border: 1px solid #2ecc71; padding: 10px; border-radius: 6px; margin-top: 12px; }
  .error { color: #c0392b; font-size: 13px; }
  .dashboard { background: #eef; border: 1px solid #99c; padding: 16px; border-radius: 6px; }
</style>
</head>
<body>

<!-- Login: điểm vào của mọi kịch bản demo, khớp target_url = .../index.html -->
<section id="login-screen" class="screen active">
  <h1>Sign in</h1>
  <label for="email-input">Email</label>
  <input id="email-input" type="email" placeholder="you@example.test">
  <label for="password-input">Password</label>
  <input id="password-input" type="password">
  <button id="login-btn" onclick="submitLogin()">Log in</button>
  <p><a id="forgot-password-link" href="#" onclick="showScreen('forgot-screen'); return false;">Forgot password?</a></p>
  <p id="login-error" class="error"></p>
</section>

<!-- Quên mật khẩu: #email-input, #send-reset-btn, .toast-success — trùng tên với plan mẫu của FakePlanner -->
<section id="forgot-screen" class="screen">
  <h1>Reset your password</h1>
  <label for="reset-email-input">Email</label>
  <input id="reset-email-input" type="email" placeholder="you@example.test">
  <button id="send-reset-btn" onclick="sendReset()">Send reset link</button>
  <div id="reset-toast" class="toast-success" style="display:none">Success! Password reset link sent to email.</div>
  <p><a href="#" onclick="showScreen('login-screen'); return false;">Back to sign in</a></p>
</section>

<!-- OTP: bất kỳ email nào chứa "otp" đăng nhập sẽ tới đây, dùng test luồng Human Intervention -->
<section id="otp-screen" class="screen">
  <h1>Verify your identity</h1>
  <p>Enter the 6-digit code we texted you.</p>
  <label for="otp-input">One-time code</label>
  <input id="otp-input" maxlength="6" placeholder="123456">
  <button id="verify-otp-btn" onclick="verifyOtp()">Verify</button>
  <p id="otp-error" class="error"></p>
</section>

<section id="dashboard-screen" class="screen">
  <div class="dashboard">
    <h1>Welcome back 👋</h1>
    <p>You are signed in.</p>
  </div>
</section>

<script>
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  function sendReset() {
    document.getElementById('reset-toast').style.display = 'block';
  }

  function submitLogin() {
    const email = document.getElementById('email-input').value;
    const error = document.getElementById('login-error');
    error.textContent = '';
    if (!email) { error.textContent = 'Email is required'; return; }
    // Email chứa "otp" → yêu cầu xác thực 2 bước (demo luồng Human Intervention)
    if (email.toLowerCase().includes('otp')) {
      showScreen('otp-screen');
    } else {
      showScreen('dashboard-screen');
    }
  }

  function verifyOtp() {
    const otp = document.getElementById('otp-input').value;
    const error = document.getElementById('otp-error');
    if (!/^\d{6}$/.test(otp)) {
      error.textContent = 'Enter the 6-digit code';
      return;
    }
    showScreen('dashboard-screen');
  }
</script>
</body>
</html>
